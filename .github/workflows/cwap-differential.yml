# cwap-differential — three-way canonical-JSON differential gate for the
# CWAP-Strict-JSON v0.1.2-r1 spike (spike/cwap-canonical-json/, ADR-007 Track B,
# issue #24). Compiles the independent Rust 2nd impl and runs Python vs Rust vs JS
# over the deterministic corpus; a non-zero exit or a canon-SHA mismatch fails.
#
# ADVISORY (not a required check) while #24 is an unbuilt, owner-gated spike:
# both triggers are path-filtered to the spike tree, so this does NOT post a
# status on unrelated PRs and must NOT be added to branch protection as required
# (that would be a phantom-block on docs-only PRs). Promote to required only when
# #24 promotion is unblocked and the filter policy is reconsidered.
#
# rustc and python3 are pre-installed on the ubuntu-24.04 runner image, so no
# third-party toolchain action is needed (keeps the workflow zizmor-clean with
# immutable pins only).
name: cwap-differential

on:
  push:
    branches: ["main"]
    paths:
      - "spike/cwap-canonical-json/**"
      - ".github/workflows/cwap-differential.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "spike/cwap-canonical-json/**"
      - ".github/workflows/cwap-differential.yml"

permissions: {}

concurrency:
  group: cwap-differential-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  three-way-differential:
    name: canonical-JSON three-way differential
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # The owner-accepted canonical accept-set fingerprint (DECISION_2026-07-19).
      # Any change to canon bytes across the three implementations breaks this.
      EXPECTED_CANON_SHA256: "2fa3c49a0de37f64441a9e2a0714404cfdf5096d6c418b4cb9a30c86f044be23"
    defaults:
      run:
        working-directory: spike/cwap-canonical-json
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22.23.1"
      - name: record toolchain (pre-installed rustc + python3)
        run: |
          set -euo pipefail
          python3 --version
          rustc --version
          node --version
      - name: build independent Rust 2nd implementation
        run: rustc -O --edition 2021 -o rust/cwap_rs rust/cwap_strict_json.rs
      - name: reference anti-regression suite (31 vectors)
        run: python3 test_cwap_v012_r1.py
      - name: two-way differential (Python vs Rust)
        run: python3 differential.py
      - name: three-way differential (Python vs Rust vs JS)
        run: python3 differential3.py
      - name: assert accept-canon-SHA matches the owner-accepted fingerprint
        run: |
          set -euo pipefail
          got="$(python3 -c 'import json;print(json.load(open("results/differential3-report.json"))["accept_canon_sha256"])')"
          echo "expected=$EXPECTED_CANON_SHA256"
          echo "got=$got"
          if [ "$got" != "$EXPECTED_CANON_SHA256" ]; then
            echo "::error::canon-SHA drift — three-way canonical bytes changed"
            exit 1
          fi
