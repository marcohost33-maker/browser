# docs-ci — Markdown lint + link check for the APP-01 docs foundation.
# Hardening: top-level empty permissions (least privilege; each job opts in),
# SHA-pinned public actions, persist-credentials: false, pinned tool versions
# (local↔CI parity). Inline (no private reusable workflow) on purpose: a
# private coworkerz-ci reusable breaks under the default GITHUB_TOKEN.
name: docs-ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  markdown-lint:
    name: markdown-lint (markdownlint-cli2)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"
      - name: markdownlint
        id: markdownlint
        continue-on-error: true
        run: |
          set -o pipefail
          npx --yes markdownlint-cli2@0.23.0 2>&1 | tee markdownlint.log
      - name: upload markdownlint diagnostics
        if: steps.markdownlint.outcome == 'failure'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: markdownlint-diagnostics
          path: markdownlint.log
          if-no-files-found: error
          retention-days: 7
      - name: enforce markdownlint result
        if: steps.markdownlint.outcome == 'failure'
        run: exit 1

  link-check:
    name: link-check (markdown-link-check)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"
      - name: check links in all tracked markdown
        run: |
          set -euo pipefail
          rc=0
          while IFS= read -r f; do
            echo "::group::$f"
            npx --yes markdown-link-check@3.14.2 --quiet \
              --config .markdown-link-check.json "$f" || rc=1
            echo "::endgroup::"
          done < <(git ls-files '*.md')
          exit "$rc"
