name: tuf-ed25519-differential

on:
  pull_request:
    paths:
      - ".github/workflows/tuf-ed25519-differential.yml"
      - "spike/tuf-offline-metadata/**"
      - "tests/tuf/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/tuf-ed25519-differential.yml"
      - "spike/tuf-offline-metadata/**"
      - "tests/tuf/**"
  schedule:
    - cron: "17 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.23.1
          cache: npm
          check-latest: false

      - name: Verify repository toolchain
        run: |
          npm run toolchain:check
          npm run lockfile:check

      - name: Run TUF unit suite
        run: node --test "tests/tuf/*.test.js"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          check-latest: false

      - name: Install hash-pinned independent oracle
        run: |
          python -m pip install --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            -r spike/tuf-offline-metadata/differential/requirements-oracle.txt

      - name: Generate deterministic Ed25519 corpus
        run: |
          mkdir -p artifacts/tuf-differential
          node spike/tuf-offline-metadata/differential/generate-corpus.mjs \
            artifacts/tuf-differential/corpus.json

      - name: Run Browser oracle
        run: |
          node spike/tuf-offline-metadata/differential/browser-oracle.mjs \
            artifacts/tuf-differential/corpus.json \
            artifacts/tuf-differential/browser-results.json

      - name: Run python-tuf oracle
        run: |
          python spike/tuf-offline-metadata/differential/python_tuf_oracle.py \
            artifacts/tuf-differential/corpus.json \
            artifacts/tuf-differential/python-tuf-results.json

      - name: Compare decisions
        run: |
          node spike/tuf-offline-metadata/differential/compare-results.mjs \
            artifacts/tuf-differential/corpus.json \
            artifacts/tuf-differential/browser-results.json \
            artifacts/tuf-differential/python-tuf-results.json \
            artifacts/tuf-differential/comparison.json

      - name: Upload differential evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tuf-ed25519-differential-evidence
          path: artifacts/tuf-differential
          if-no-files-found: error
          retention-days: 14
