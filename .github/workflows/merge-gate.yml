# merge-gate — always-run exact-subject gate for main (issue #53).
#
# This workflow is intentionally self-contained: path-filtered advisory workflows
# remain useful evidence, but branch protection can require the single terminal
# "merge gate" job without phantom-blocking unrelated pull requests.
name: merge-gate

on:
  pull_request:
    branches: ["main"]
  merge_group:
    branches: ["main"]

permissions: {}

concurrency:
  group: merge-gate-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: determine applicable checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      activation: ${{ steps.scope.outputs.activation }}
      subject: ${{ steps.subject.outputs.subject }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: subject
        name: bind gate to exact policy subject
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          subject="${PR_HEAD:-${MERGE_GROUP_HEAD:-$CHECKOUT_SHA}}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$subject"
          echo "subject=$subject" >> "$GITHUB_OUTPUT"
      - id: scope
        name: classify activation-store scope from exact diff
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          base="${PR_BASE:-$MERGE_GROUP_BASE}"
          test -n "$base"
          git cat-file -e "$base^{commit}"
          changed="$(git diff --name-only "$base"...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(spike/activation-store/|tests/activation/|\.github/workflows/activation-store-ci\.yml|\.github/workflows/merge-gate\.yml)'; then
            echo "activation=true" >> "$GITHUB_OUTPUT"
          else
            echo "activation=false" >> "$GITHUB_OUTPUT"
          fi

  baseline:
    name: baseline exact-head
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ needs.scope.outputs.subject }}
      CI: "true"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.scope.outputs.subject }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.1"
          cache: npm
      - name: verify exact subject checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: verify toolchain and lockfile
        run: |
          npm run toolchain:check
          npm run lockfile:check
      - name: deterministic install
        run: npm ci --ignore-scripts --audit=false --fund=false
      - name: dependency vulnerability gate
        run: npm run audit:ci
      - name: security policy and regression tests
        run: |
          npm run csp:check
          npm test
      - name: documentation governance and lint
        run: |
          npm run docs:governance
          npm run docs:lint
      - name: link check
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          while IFS= read -r f; do
            ./node_modules/.bin/markdown-link-check --quiet --config .markdown-link-check.json "$f" || rc=1
          done < <(git ls-files '*.md')
          exit "$rc"

  activation:
    name: activation store (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.activation == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.scope.outputs.subject }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.1"
      - name: verify exact subject checkout
        shell: bash
        env:
          SUBJECT: ${{ needs.scope.outputs.subject }}
        run: test "$(git rev-parse HEAD)" = "$SUBJECT"
      - name: platform probe
        run: node spike/activation-store/harness/platform-probe.mjs
      - name: store, model and crash tests
        run: node --test "tests/activation/*.test.js"
      - name: real-filesystem process crashes
        run: node spike/activation-store/crash-matrix.mjs --real-fs-only

  gate:
    name: merge gate
    if: always()
    needs: [scope, baseline, activation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: require all applicable checks on this subject
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          BASELINE_RESULT: ${{ needs.baseline.result }}
          ACTIVATION_REQUIRED: ${{ needs.scope.outputs.activation }}
          ACTIVATION_RESULT: ${{ needs.activation.result }}
          SUBJECT: ${{ needs.scope.outputs.subject }}
        run: |
          set -euo pipefail
          echo "subject=$SUBJECT"
          test "$SCOPE_RESULT" = "success"
          test "$BASELINE_RESULT" = "success"
          if [ "$ACTIVATION_REQUIRED" = "true" ]; then
            test "$ACTIVATION_RESULT" = "success"
          else
            test "$ACTIVATION_RESULT" = "skipped"
          fi
