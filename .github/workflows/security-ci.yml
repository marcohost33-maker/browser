# security-ci — enforce the CSP + security-header profile (M1B).
#
# Turns docs/security/csp-baseline.json from "specified" into "enforced":
#   1. deterministic install from package-lock.json with lifecycle scripts off
#   2. complete CSP/header/endpoint fail-closed gate
#   3. serializer + served-header integration and regression tests
#   4. SPDX SBOM generation retained as workflow evidence
#
# Hardening mirrors docs-ci.yml: top-level empty permissions (least privilege),
# SHA-pinned public actions, persist-credentials: false and pinned Node major.
name: security-ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

concurrency:
  group: security-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  csp-enforcement:
    name: hardened policy gate + security tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"
          cache: npm
      - name: deterministic install with lifecycle scripts disabled
        run: npm ci --ignore-scripts --audit=false --fund=false
      - name: CSP, endpoint and security-header fail-closed gate
        run: npm run csp:check
      - name: serializer, served-header and regression tests
        run: npm test
      - name: generate SPDX SBOM
        run: |
          npm sbom --sbom-format=spdx > sbom.spdx.json
          node -e "JSON.parse(require('node:fs').readFileSync('sbom.spdx.json', 'utf8'))"
      - name: upload SBOM evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: app-01-sbom-${{ github.sha }}
          path: sbom.spdx.json
          if-no-files-found: error
          retention-days: 14
